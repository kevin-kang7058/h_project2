<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22A06B">
  <title>오늘의 동선 · 로그인</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/auth-form.js" defer></script>
</head>
<body data-auth-page="login" data-auth-state="checking">
  <header class="site-header"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="36" height="36">오늘의 동선<span class="brand-dot">.</span></a><span class="header-caption">가까운 곳부터, 가벼운 하루로</span></header>
  <section id="auth-status" class="auth-status card" aria-live="polite"><p id="auth-status-message">로그인 상태를 확인하고 있어요…</p><button id="auth-retry" class="button secondary" type="button" hidden>다시 시도</button></section>
  <main class="auth-page">
    <section class="page-intro"><p class="eyebrow">WELCOME BACK</p><h1>오늘의 동선에<br>다시 오셨네요.</h1><p>로그인하고 오늘 방문할 곳을 정리해 보세요.</p></section>
    <section class="card auth-card">
      <h2>이메일로 로그인</h2>
      <form id="auth-form" novalidate>
        <div class="field-group"><label for="auth-email">이메일</label><input id="auth-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
        <div class="field-group"><label for="auth-password">비밀번호</label><input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" required></div>
        <p id="auth-error" class="field-error" role="alert"></p><p id="auth-feedback" class="auth-feedback" role="status"></p>
        <button id="auth-submit" class="button primary full-width" type="submit">로그인하기</button>
      </form>
      <p class="auth-switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </section>
  </main>
  <footer class="site-footer"><span>오늘의 동선</span><span>당신의 하루에, 더 나은 순서.</span></footer>
  <noscript><p class="connection-notice">로그인을 사용하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
</body>
</html>
